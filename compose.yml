# Generated by Claude Opus 5.5 (claude.ai/code) · 2026-11-23
# Local preview of the site: `docker compose up`, then open http://localhost:4000/entree-libre/
# Sources are mounted read-only: the built site and the gems stay inside Docker, nothing is written to the repo.
services:
  site:
    image: ruby:3.3
    working_dir: /srv/site
    volumes:
      - ./site:/srv/site:ro
      - gems:/usr/local/bundle
    environment:
      # The ruby image points BUNDLE_APP_CONFIG at /usr/local/bundle, so site/.bundle/config is ignored.
      BUNDLE_FROZEN: "true"
    # One string on purpose: a folded YAML block keeps line breaks before indented lines, which sh then runs as separate commands.
    command:
      - sh
      - -c
      - bundle install --quiet && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --destination /tmp/site --disable-disk-cache --force_polling --livereload
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:35729:35729"

volumes:
  gems:
